backend:
  name: github
  repo: Sayadbayezid/MusfiqrFarhan
  branch: main
  commit_messages:
    create: Create {{collection}} "{{slug}}"
    update: Update {{collection}} "{{slug}}"
    delete: Delete {{collection}} "{{slug}}"
    uploadMedia: Upload "{{path}}"
    deleteMedia: Delete "{{path}}"

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://musfiqrfarhan.blog
display_url: https://musfiqrfarhan.blog
logo_url: https://musfiqrfarhan.blog/assets/images/logo.svg

locale: en

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Radio", "Television", "Acting", "Content Creation", "Personal"], required: false }

  - name: "projects"
    label: "Projects & Works"
    folder: "_pages/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["Radio", "Television", "Acting", "Content Creation"] }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Details", name: "body", widget: "markdown" }
      - { label: "Link", name: "link", widget: "string", required: false }
